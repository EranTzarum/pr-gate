<svg xmlns="http://www.w3.org/2000/svg" width="940" height="204" viewBox="0 0 940 204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Fresh eyes: A reviewer that didn&#39;t write the code checks it against the repo&#39;s own docs, after CI.. No messenger work: Fix requests go back to the session that owns the branch, for up to 3 rounds.. Your call: Nothing merges without your literal merge reply, for that PR, after the green report.">
